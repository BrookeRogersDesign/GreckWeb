<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Shop · GRECK</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=23">
</head>
<body data-page="shop">
  <div data-header></div>

  <main>
    <section class="page-hero">
      <p class="eyebrow">Shop · Drop 01</p>
      <h1>One of one, every time.</h1>
      <p class="page-hero-lede">Each bag is painted once and never again. When it's gone, it's gone, so if it speaks to you, don't sleep on it.</p>
    </section>

    <div class="shop-bar">
      <div class="chips" role="group" aria-label="Filter bags">
        <button class="chip is-on" type="button" data-filter="all">All</button>
        <button class="chip" type="button" data-filter="bugs">Bugs</button>
        <button class="chip" type="button" data-filter="dots">Dots</button>
        <button class="chip" type="button" data-filter="color">Color</button>
        <button class="chip" type="button" data-filter="available">Available</button>
      </div>
      <span class="shop-count" aria-live="polite"></span>
    </div>

    <section class="shop-grid">
      <div class="pgrid" data-products>
        <figure class="pgrid-feature">
          <img src="assets/photos/orange-wall.jpg" alt="Model in a cream suit holding a plaid painted bag against an orange wall" loading="lazy">
        </figure>
      </div>
    </section>
  </main>

  <div data-footer></div>
  <script src="bags.js?v=1"></script>
</body>
</html>
